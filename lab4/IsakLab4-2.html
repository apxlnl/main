<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Рядок що біжить</title>
    </head>
    <body background="image.jpg" text="#ffffff">
        <p align="center"><font size="5"><b>Приклади різних рядків</b></font></p>
        <marquee behavior="alternate" bgcolor="#ffcccc" height="40">
        <font color="black" face="Arial" size="4">
            <b>1. Цей текст коливається з боку в бік.</b>
        </font>
        </marquee>
        <br><br>
        <marquee direction="left" behavior="scroll" bgcolor="#ccffcc" height="40">
            <font color="blue" face="Verdana" size="4">
                <i>2. Цей текст пробігає справа наліво та з’являється знову.</i>
            </font>
        </marquee>
        <br><br>
        <marquee direction="right" behavior="slide" bgcolor="#ccccff" height="40">
            <font color="black" face="Courier New" size="4">
                3. Цей текст пробігає зліва направо та зупиняється.
            </font>
        </marquee>
        <br><br>
        <marquee scrolldelay="200" bgcolor="#ffffcc" height="40">
            <font color="purple" face="Georgia" size="4">
                4. Цей текст переміщується з великим запізненням (повільно).
            </font>
        </marquee>
        <br><br>
        <marquee scrolldelay="20" bgcolor="#ffccff" height="40">
            <font color="darkgreen" face="Impact" size="4">
                5. Цей текст переміщується з малим запізненням (швидко).
            </font>
        </marquee>
    </body>
</html>
